name: Internet Push Reminders (2-Min Cloud Loop)

on:
  schedule:
    # Run every 5 minutes automatically on GitHub Cloud
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-2min-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send Cloud Push #1
        run: |
          curl -X POST "https://yrnhjicryhsvoxazigug.supabase.co/functions/v1/send-push" \
            -H "Content-Type: application/json" \
            -d '{"targetUserId": "all", "message": "HydraLove 💧 Time for a water break! 💕 (2-Min Internet Push)"}' || true
      - name: Wait 120 seconds
        run: sleep 120
      - name: Send Cloud Push #2
        run: |
          curl -X POST "https://yrnhjicryhsvoxazigug.supabase.co/functions/v1/send-push" \
            -H "Content-Type: application/json" \
            -d '{"targetUserId": "all", "message": "HydraLove 💧 Water Break Time! 💕 (2-Min Internet Push)"}' || true
